name: CI Workflow

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: pip install mlflow==2.19.0 scikit-learn pandas numpy

      - name: Run mlflow project
        run: mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_DIR=$(find . -type d -path "*mlruns/0/*" -maxdepth 4 -name "[0-9a-f]*" | head -1)
          RUN_ID=$(basename "$RUN_DIR")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV
          echo "Run ID: $RUN_ID"

      - name: Upload artifacts to GitHub (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: ${{ env.RUN_DIR }}

      - name: Save artifacts to repository
        run: |
          mkdir -p artifacts
          cp -r "$RUN_DIR" artifacts/run_$RUN_ID
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts
          git commit -m "Simpan artefak MLflow run $RUN_ID" || echo "Tidak ada perubahan"
          git push

      - name: Build Docker Model
        run: mlflow models build-docker -m "runs:/${{ env.RUN_ID }}/model" -n heart-failure-model --env-manager local
        env:
          MLFLOW_TRACKING_URI: file:./mlruns

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: docker tag heart-failure-model ${{ secrets.DOCKERHUB_USERNAME }}/heart-failure-model:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-failure-model:latest